<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterviewCopilot · 面试拷打助手</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --card: #1e2230; --border: #2a2f42;
    --text: #e6e9f2; --muted: #8b93a8; --accent: #4f7cff; --accent2: #3ecf8e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge { font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 3px 10px; border-radius: 12px; }
  header .spacer { flex: 1; }
  header button { background: var(--card); color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  header button:hover { color: var(--text); }

  main { flex: 1; display: flex; overflow: hidden; }

  aside { width: 280px; background: var(--panel); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  aside h2 { font-size: 14px; color: var(--muted); font-weight: 600; }
  aside input[type=text] { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  aside button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
  aside button:hover { filter: brightness(1.15); }
  aside button.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  aside .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
  aside .stat { font-size: 13px; color: var(--accent2); }

  #chat { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot b { color: #fff; }
  .msg.error { align-self: center; background: transparent; border: 1px solid #a33; color: #e88; font-size: 13px; }
  .msg .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .msg .sources span { font-size: 11px; color: var(--accent2); background: rgba(62,207,142,.1); border: 1px solid rgba(62,207,142,.35); padding: 2px 8px; border-radius: 10px; cursor: default; }

  #inputbar { display: flex; gap: 10px; padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--border); }
  #inputbar select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; font-size: 13px; }
  #inputbar input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  #inputbar button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; }
  #inputbar button:disabled { background: var(--border); cursor: not-allowed; }
  .typing { color: var(--muted); font-size: 13px; align-self: flex-start; }
</style>
</head>
<body>
<header>
  <h1>🎯 InterviewCopilot 面试拷打助手</h1>
  <span class="badge" id="modelBadge">…</span>
  <span class="badge" id="kbBadge">知识库 0 篇</span>
  <span class="spacer"></span>
  <button onclick="location.reload()">🔄 新对话</button>
</header>

<main>
  <aside>
    <h2>📚 知识库</h2>
    <input type="text" id="kbPath" placeholder="服务端目录或 .md 路径">
    <button onclick="importPath()">按路径导入</button>
    <input type="file" id="fileInput" accept=".md,.txt" multiple hidden onchange="uploadFiles(this.files)">
    <button class="ghost" onclick="document.getElementById('fileInput').click()">⬆ 上传 .md 文件</button>
    <div class="hint">
      导入的笔记会被切分、本地向量化（bge-small-zh）后存入内存向量库，
      对话时自动检索最相关的段落作为参考资料。重复文件名自动跳过。
    </div>
    <div class="stat" id="kbStat"></div>

    <h2>🎤 面试模式</h2>
    <select id="topicSel" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;"></select>
    <input type="text" id="qCount" placeholder="题数（默认 5）" inputmode="numeric">
    <button class="ghost" onclick="startInterview()">🎤 开始拷打</button>
    <button class="ghost" onclick="endInterview()" id="endBtn" style="display:none">⛔ 结束面试</button>
    <div class="hint">出题 → 你口头作答（打字提交）→ 面试官基于知识库评分、指出欠缺并追问。</div>
    <div class="stat" id="ivStat"></div>
  </aside>

  <div id="chat">
    <div id="messages"></div>
    <div id="inputbar">
      <select id="mode" title="直连=不检索知识库；RAG=检索增强">
        <option value="rag">RAG 增强模式</option>
        <option value="ask">直连模式（无 RAG）</option>
      </select>
      <input type="text" id="question" placeholder="输入面试题，如：讲讲 HashMap 的扩容机制" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>

<script>
const sessionId = crypto.randomUUID();
const messages = document.getElementById('messages');

// 极简 Markdown 渲染：先转义 HTML，再加粗/行内代码
function renderMd(text) {
  let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

function addMsg(cls, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function refreshStatus() {
  try {
    const h = await (await fetch('/api/health')).json();
    document.getElementById('modelBadge').textContent = h.model + (h.llmKeyConfigured ? '' : ' · 未配置 Key');
    document.getElementById('kbBadge').textContent = '知识库 ' + h.knowledgeFiles + ' 篇';
  } catch (e) { /* ignore */ }
}

async function importPath() {
  const path = document.getElementById('kbPath').value.trim();
  if (!path) return;
  const stat = document.getElementById('kbStat');
  stat.textContent = '导入中…（大语料本地向量化约需几十秒）';
  try {
    const r = await fetch('/api/knowledge/import', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    });
    const d = await r.json();
    stat.textContent = r.ok ? `✅ 新导入 ${d.importedFiles} 篇 / ${d.segments} 段（跳过 ${d.skippedFiles}）`
                           : '❌ ' + (d.error || r.status);
  } catch (e) { stat.textContent = '❌ ' + e.message; }
  refreshStatus();
}

async function uploadFiles(files) {
  if (!files.length) return;
  const stat = document.getElementById('kbStat');
  stat.textContent = '上传并导入中…';
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  try {
    const r = await fetch('/api/knowledge/upload', { method: 'POST', body: fd });
    const d = await r.json();
    stat.textContent = r.ok ? `✅ 新导入 ${d.importedFiles} 篇 / ${d.segments} 段（跳过 ${d.skippedFiles}）`
                           : '❌ ' + (d.error || r.status);
  } catch (e) { stat.textContent = '❌ ' + e.message; }
  document.getElementById('fileInput').value = '';
  refreshStatus();
}

async function send() {
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  // 面试模式：输入即当前题的回答
  if (interview.active) {
    addMsg('user', renderMd(q));
    await submitAnswer(q, btn, input);
    return;
  }

  addMsg('user', renderMd(q));
  const mode = document.getElementById('mode').value;
  const typing = addMsg('typing', mode === 'rag' ? '检索知识库并思考中…' : '思考中…');
  try {
    let r, d;
    if (mode === 'rag') {
      r = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, question: q })
      });
      d = await r.json();
    } else {
      r = await fetch('/api/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      d = await r.json();
    }
    typing.remove();
    if (!r.ok) {
      addMsg('error', '⚠ ' + (d.error || ('HTTP ' + r.status)));
    } else if (mode === 'rag') {
      let html = renderMd(d.answer);
      if (d.sources && d.sources.length) {
        html += '<div class="sources">' +
          d.sources.map(s => `<span title="相似度 ${Number(s.score).toFixed(3)}">${s.file}</span>`).join('') +
          '</div>';
      } else {
        html += '<div class="sources"><span>（知识库未命中，通用回答）</span></div>';
      }
      addMsg('bot', html);
    } else {
      addMsg('bot', renderMd(d.answer) + `<div class="sources"><span>直连模式 · ${d.latencyMs}ms</span></div>`);
    }
  } catch (e) {
    typing.remove();
    addMsg('error', '⚠ ' + e.message);
  }
  btn.disabled = false;
  input.focus();
}

// ---------- 面试模式 ----------
const interview = { active: false, sessionId: null, questions: [], current: -1, topic: '' };

async function loadTopics() {
  try {
    const d = await (await fetch('/api/interview/topics')).json();
    const sel = document.getElementById('topicSel');
    sel.innerHTML = (d.topics && d.topics.length)
      ? d.topics.map(t => `<option value="${t}">${t}</option>`).join('') + '<option value="Java 后端">混合（全部）</option>'
      : '<option value="Java 后端">Java 后端（知识库为空）</option>';
  } catch (e) { /* ignore */ }
}

async function startInterview() {
  const topic = document.getElementById('topicSel').value || 'Java 后端';
  const count = parseInt(document.getElementById('qCount').value) || 5;
  const stat = document.getElementById('ivStat');
  stat.textContent = '出题中…';
  try {
    const r = await fetch('/api/interview/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, count })
    });
    const d = await r.json();
    if (!r.ok) { stat.textContent = '❌ ' + (d.error || r.status); return; }
    interview.active = true;
    interview.sessionId = d.sessionId;
    interview.questions = d.questions;
    interview.current = 0;
    interview.topic = d.topic;
    document.getElementById('endBtn').style.display = '';
    document.getElementById('mode').disabled = true;
    addMsg('bot', `🎤 <b>《${d.topic}》面试开始</b>，共 ${d.questions.length} 题。逐题作答，答完自动出下一题。`);
    showQuestion();
    stat.textContent = '';
  } catch (e) { stat.textContent = '❌ ' + e.message; }
}

function showQuestion() {
  const q = interview.questions[interview.current];
  if (q === undefined) { endInterview(true); return; }
  addMsg('bot', `<b>第 ${interview.current + 1}/${interview.questions.length} 题：</b>${renderMd(q)}`);
  document.getElementById('question').placeholder = '输入你的回答，回车提交';
}

async function submitAnswer(answer, btn, input) {
  const typing = addMsg('typing', '面试官批改中…');
  const question = interview.questions[interview.current];
  try {
    const r = await fetch('/api/interview/answer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: interview.sessionId, question, answer })
    });
    const d = await r.json();
    typing.remove();
    if (!r.ok) { addMsg('error', '⚠ ' + (d.error || ('HTTP ' + r.status))); }
    else {
      const score = d.score >= 0 ? `<b style="font-size:18px;color:${d.score >= 7 ? 'var(--accent2)' : d.score >= 4 ? '#f0b429' : '#e06060'}">${d.score} / 10</b>` : '';
      let html = `📋 ${score}`;
      if (d.highlights && d.highlights.length) html += `\n✅ 亮点：` + d.highlights.map(renderMd).join('；');
      if (d.gaps && d.gaps.length) html += `\n⚠️ 欠缺：` + d.gaps.map(renderMd).join('；');
      if (d.reference) html += `\n📖 参考要点：` + renderMd(String(d.reference));
      if (d.followUp) html += `\n🔗 面试官追问：<b>${renderMd(d.followUp)}</b>（可在下一题回答中回应）`;
      if (d.sources && d.sources.length) {
        html += '<div class="sources">' + d.sources.map(s => `<span>${s.file}</span>`).join('') + '</div>';
      }
      addMsg('bot', html);
      interview.current++;
      showQuestion();
    }
  } catch (e) { typing.remove(); addMsg('error', '⚠ ' + e.message); }
  btn.disabled = false;
  input.focus();
}

function endInterview(finished) {
  if (interview.active) {
    addMsg('bot', finished ? '🎤 <b>面试结束。</b>回顾上面的欠缺点，去知识库对应笔记里补一补。' : '🎤 面试已中止。');
  }
  interview.active = false;
  interview.sessionId = null;
  interview.questions = [];
  interview.current = -1;
  document.getElementById('endBtn').style.display = 'none';
  document.getElementById('mode').disabled = false;
  document.getElementById('question').placeholder = '输入面试题，如：讲讲 HashMap 的扩容机制';
}

refreshStatus();
loadTopics();
addMsg('bot', '👋 我是你的**面试拷打助手**。知识库的笔记我已读完，随便问八股；\n左侧可选 **🎤 面试模式** 让我出题拷打你，答完给你打分。');
</script>
</body>
</html>
